<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{background:transparent;width:1760px;height:960px}
.wrap{width:1760px;display:flex;flex-direction:column;align-items:center}
.lid{width:1600px;background:linear-gradient(180deg,#2a2d31,#14161a);border-radius:44px 44px 14px 14px;padding:26px 24px 30px;position:relative;box-shadow:inset 0 0 0 2px #3b3f45,inset 0 0 0 4px #0b0c0e}
.cam{position:absolute;top:9px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#0a0b0d;box-shadow:inset 0 0 0 2px #30343a}
.scr{position:relative;border-radius:8px;overflow:hidden;background:#fff;line-height:0}
.scr img{width:1552px;height:auto;display:block}
.scr::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 32%)}
.base{width:1760px;height:34px;margin-top:-2px;border-radius:0 0 60px 60px/0 0 34px 34px;background:linear-gradient(180deg,#d7dade 0%,#bfc3c9 55%,#9ea3aa 100%);position:relative;box-shadow:inset 0 2px 0 #eceef0}
.base::after{content:"";position:absolute;top:0;left:50%;width:300px;height:12px;margin-left:-150px;border-radius:0 0 18px 18px;background:linear-gradient(180deg,#a7abb2,#c9cdd2)}
</style></head><body><div class="wrap"><div class="lid"><div class="cam"></div><div class="scr"><img src="editor_1600.png"></div></div><div class="base"></div></div></body></html>
